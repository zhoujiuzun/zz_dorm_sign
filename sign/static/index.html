<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍签到看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>宿舍签到看板</h1>
    <div class="topbar-right">
      <div class="today" id="today">--</div>
      <button id="show-login-btn" class="btn-link">登录</button>
      <button id="signing-toggle-btn" class="btn-link" hidden>停止签到</button>
      <button id="logout-btn" class="btn-link" hidden>退出</button>
    </div>
  </header>

  <!-- 姓名验证弹窗 -->
  <div class="login-mask" id="name-verify-mask">
    <div class="login-box">
      <h2>输入您的姓名</h2>
      <p style="font-size: 14px; color: #666; margin-bottom: 16px;">输入后将只显示您自己的签到信息</p>
      <input type="text" id="name-input" placeholder="请输入您的姓名" autocomplete="off">
      <button id="name-verify-btn" class="btn-primary">查看我的签到</button>
      <div class="login-err" id="name-verify-err"></div>
    </div>
  </div>

  <!-- 登录/切换用户弹窗 -->
  <div class="login-mask" id="login-mask" hidden>
    <div class="login-box">
      <h2>登录/切换用户</h2>

      <!-- 切换到其他普通用户 -->
      <div style="margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid #eee;">
        <h3 style="font-size: 16px; margin-bottom: 12px;">切换到其他用户</h3>
        <input type="text" id="switch-user-name" placeholder="输入用户姓名" autocomplete="off" style="margin-bottom: 8px;">
        <button id="switch-user-btn" class="btn-primary">切换</button>
        <div class="login-err" id="switch-user-err"></div>
      </div>

      <!-- 管理员登录 -->
      <div>
        <h3 style="font-size: 16px; margin-bottom: 12px;">管理员登录</h3>
        <input type="text" id="login-user" placeholder="管理员账号" autocomplete="username" style="margin-bottom: 8px;">
        <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" style="margin-bottom: 8px;">
        <button id="login-btn" class="btn-primary">登录</button>
        <div class="login-err" id="login-err"></div>
      </div>

      <button id="login-cancel" class="btn-link" style="margin-top: 16px;">取消</button>
    </div>
  </div>

  <div class="signing-notice" id="signing-notice" hidden>
    当前为假期暂停状态，系统不会自动提交签到。
  </div>

  <section class="overview" id="overview">
    <div class="stat stat-total"><span class="num" id="ov-total">-</span><span class="lbl">总人数</span></div>
    <div class="stat stat-ok"><span class="num" id="ov-ok">-</span><span class="lbl">今日已签</span></div>
    <div class="stat stat-fail"><span class="num" id="ov-fail">-</span><span class="lbl">今日异常</span></div>
    <div class="stat stat-pending"><span class="num" id="ov-pending">-</span><span class="lbl">今日未签</span></div>
  </section>

  <main id="main-content" hidden>
    <div class="layout">
      <section class="left">
        <div class="tabs" id="tabs">
          <button class="tab active" data-view="members">成员</button>
          <button class="tab" data-view="blacklist">黑名单</button>
        </div>
        <h2 class="sec-title"><span id="view-title">成员</span> <span class="count" id="member-count"></span></h2>
        <input type="search" id="search" class="search" placeholder="搜索姓名…" autocomplete="off">
        <div class="members" id="members"></div>
        <div class="blacklist" id="blacklist" hidden></div>
      </section>

      <section class="usercard right" id="usercard" hidden>
        <div class="uc-head">
          <div class="uc-name" id="uc-name">--</div>
          <div class="uc-stats">
            <span class="chip chip-ok" id="uc-okdays">已签 -- 天</span>
            <span class="chip chip-fail" id="uc-faildays">异常 -- 天</span>
          </div>
        </div>

        <div class="blacklist-alert" id="uc-blacklist-alert" hidden>
          ⚠️ 该成员已被拉黑，以下为历史记录
        </div>

        <div class="cal-nav">
          <button id="prev-month" class="navbtn" aria-label="上个月">‹</button>
          <div class="cal-title" id="cal-title">----年--月</div>
          <button id="next-month" class="navbtn" aria-label="下个月">›</button>
        </div>

        <table class="calendar">
          <thead><tr>
            <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th class="sun">日</th>
          </tr></thead>
          <tbody id="cal-body"></tbody>
        </table>

        <div class="legend">
          <span><i class="dot d-ok"></i>已签到</span>
          <span><i class="dot d-fail"></i>失败/异常</span>
          <span><i class="dot d-pending"></i>未签</span>
          <span><i class="dot d-none"></i>无记录</span>
        </div>
      </section>
    </div>
  </main>



  <footer class="foot" id="foot">加载中…</footer>
  <script src="/app.js"></script>
</body>
</html>
