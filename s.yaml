edition: 3.0.0
name: dorm-sign
access: default

# ====================================================================
# 部署前必须在阿里云 FC 控制台或此处填好「环境变量」与「角色」：
#   CLIENT_SECRET    小程序 client_secret（敏感，勿提交到代码库）
#   SERVERCHAN_KEY   Server酱 SendKey（敏感）
#   REGISTER_SECRET  采集工具上报 openid 时校验的预共享口令（敏感）
#   role             一个有 OSS 读写权限的 RAM 角色 ARN（用于免 AK/SK 访问 OSS）
#
# cron 说明：FC 定时触发器的 cron 表达式按 UTC 计算。
#   签到窗口 21:00-22:30（北京时间 UTC+8）对应 UTC 13:00-14:30。
#   下方在窗口内安排 4 次：北京 21:02 / 21:27 / 21:52 / 22:17。
# ====================================================================

vars:
  region: cn-beijing
  # 自定义域名（待 zhztool.top 完成 ICP 备案后再启用，见 域名配置步骤.md）
  # customDomain: sign.zhztool.top

resources:
  dormSign:
    component: fc3
    props:
      region: ${vars.region}
      functionName: sign
      runtime: python3.10
      handler: index.handler
      code: ./sign
      timeout: 300
      memorySize: 512
      cpu: 0.35
      diskSize: 512
      instanceConcurrency: 1
      internetAccess: true
      # 有 OSS 读写权限的 RAM 角色
      role: 'acs:ram::1065003092022393:role/fc-dorm-sign-oss'
      environmentVariables:
        TZ: Asia/Shanghai
        BASE_URL: https://simp.csuft.edu.cn
        CLIENT_ID: flysource_wise_wxapp
        TENANT_ID: '000000'
        OSS_BUCKET: zhouhuanzhang
        OSS_REGION: cn-beijing
        OSS_ENDPOINT: oss-cn-beijing-internal.aliyuncs.com
        # 敏感值通过 ${env(...)} 在部署时从本机环境变量读取，不写入本文件。
        # 部署前用 deploy.ps1 设置这三个环境变量（见 deploy.ps1）。
        CLIENT_SECRET: ${env('CLIENT_SECRET')}
        SERVERCHAN_KEY: ${env('SERVERCHAN_KEY')}
        REGISTER_SECRET: ${env('REGISTER_SECRET')}
        # 管理员账号密码（黑名单功能需要）
        ADMIN_USER: ${env('ADMIN_USER')}
        ADMIN_PASS: ${env('ADMIN_PASS')}
        # 令牌签发密钥（HMAC，仅存环境变量，源码泄露也无法伪造令牌）
        TOKEN_SECRET: ${env('TOKEN_SECRET')}
      triggers:
        - triggerName: httpTrigger
          triggerType: http
          triggerConfig:
            authType: anonymous
            methods:
              - GET
              - POST
              - OPTIONS
        - triggerName: signWindowH21
          triggerType: timer
          triggerConfig:
            # 北京 21:00-21:59 每分钟 = UTC 13:00-13:59 每分钟
            cronExpression: '0 * 13 * * *'
            enable: true
        - triggerName: signWindowH22
          triggerType: timer
          triggerConfig:
            # 北京 22:00-22:20 每分钟 = UTC 14:00-14:20 每分钟
            cronExpression: '0 0-20 14 * * *'
            enable: true
      # 自定义域名（待 zhztool.top 完成 ICP 备案后取消注释启用）
      # customDomains:
      #   - domainName: ${vars.customDomain}
      #     protocol: HTTP
      #     routeConfigs:
      #       - path: /*
      #         methods:
      #           - GET
      #           - POST
