<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍签到看板</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>宿舍签到看板</h1>
    <div class="topbar-right">
      <div class="today" id="today">--</div>
      <button type="button" id="switch-btn" class="btn-link" hidden>切换账号</button>
    </div>
  </header>

  <!-- 登录：姓名 + 学号 -->
  <div class="login-mask" id="login-mask" hidden>
    <form class="login-box" id="login-form" novalidate>
      <h2>查看我的签到</h2>
      <p class="dialog-desc">输入姓名和学号，只显示你自己的签到信息</p>
      <input type="text" id="login-name" placeholder="姓名" autocomplete="name" aria-label="姓名">
      <input type="text" id="login-sid" placeholder="学号" inputmode="numeric" autocomplete="off" aria-label="学号">
      <div class="login-err" id="login-err" role="alert"></div>
      <button type="submit" class="btn-primary" id="login-btn">登录</button>
      <div class="dialog-foot">
        <a class="btn-link" href="/admin.html">管理员登录</a>
        <button type="button" class="btn-link" id="login-cancel" hidden>取消</button>
      </div>
    </form>
  </div>

  <div class="signing-notice" id="signing-notice" hidden>
    当前为假期暂停状态，系统不会自动提交签到。
  </div>

  <main id="main-content" hidden>
    <div class="layout">
      <section class="left">
        <h2 class="sec-title">我的签到</h2>
        <div class="members" id="members"></div>
        <section class="panel" aria-labelledby="settings-title">
          <h2 class="panel-title" id="settings-title">签到设置</h2>
          <div id="settings"><div class="empty-sm">加载中…</div></div>
        </section>
        <button type="button" class="btn-quiet-danger" id="quit-btn">退出自动签到</button>
      </section>

      <section class="usercard right" id="usercard">
        <div class="uc-head">
          <div class="uc-name" id="uc-name">--</div>
          <div class="uc-stats">
            <span class="chip chip-ok" id="uc-okdays">已签 -- 天</span>
            <span class="chip chip-fail" id="uc-faildays">异常 -- 天</span>
          </div>
        </div>
        <div class="cal-nav">
          <button type="button" id="prev-month" class="navbtn" aria-label="上个月">‹</button>
          <div class="cal-title" id="cal-title">----年--月</div>
          <button type="button" id="next-month" class="navbtn" aria-label="下个月">›</button>
        </div>
        <table class="calendar">
          <thead><tr>
            <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th class="sun">日</th>
          </tr></thead>
          <tbody id="cal-body"></tbody>
        </table>
        <div class="legend">
          <span><i class="dot d-ok"></i>已签到</span>
          <span><i class="dot d-fail"></i>失败/异常</span>
          <span><i class="dot d-pending"></i>未签</span>
          <span><i class="dot d-none"></i>无记录</span>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot" id="foot">加载中…</footer>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
