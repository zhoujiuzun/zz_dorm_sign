<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#e6f6f0">
  <title>宿舍签到</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>宿舍签到</div>
    <div class="bar-right">
      <span class="clock" id="today">--</span>
      <span class="user-chip" id="user-chip" hidden></span>
      <button type="button" class="btn btn-ghost btn-sm" id="logout-btn" hidden>退出登录</button>
    </div>
  </header>

  <div class="mask" id="login-mask" hidden>
    <form class="dialog" id="login-form" novalidate>
      <span class="brand-mark big" aria-hidden="true"></span>
      <h2>查看我的签到</h2>
      <p class="dialog-desc">输入姓名和学号，只显示你自己的签到信息</p>
      <label class="field"><span>姓名</span>
        <input class="input" type="text" id="login-name" autocomplete="name"></label>
      <label class="field"><span>学号</span>
        <input class="input" type="text" id="login-sid" inputmode="numeric" autocomplete="off"></label>
      <div class="form-err" id="login-err" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-block" id="login-btn">登录</button>
      <div class="dialog-foot center"><a class="link-btn" href="/admin.html">管理员入口</a></div>
    </form>
  </div>

  <div class="notice" id="signing-notice" hidden>当前为假期暂停状态，系统不会自动提交签到。</div>

  <main class="page" id="main-content" hidden>
    <div class="user-grid">
      <div class="stack">
        <section class="card today-card" aria-label="今天的签到">
          <div class="today-block tone-wait" id="today-box"><div class="tb-sub">加载中…</div></div>
        </section>
        <section class="card" aria-labelledby="info-title">
          <div class="card-head">
            <h2 class="card-title" id="info-title">我的签到设置</h2>
            <button type="button" class="btn btn-danger btn-sm" id="quit-btn">停用自动签到</button>
          </div>
          <div id="info-box"><div class="hint">加载中…</div></div>
        </section>
      </div>

      <section class="card cal-card" aria-labelledby="uc-name">
        <div class="cal-head">
          <h2 class="card-title" id="uc-name">签到日历</h2>
          <div class="chips">
            <span class="tag tag-ok" id="uc-okdays">已签 -- 天</span>
            <span class="tag tag-fail" id="uc-faildays">异常 -- 天</span>
          </div>
        </div>
        <div class="cal-nav">
          <button type="button" id="prev-month" class="nav-btn" aria-label="上个月">‹</button>
          <div class="cal-title" id="cal-title">----年--月</div>
          <button type="button" id="next-month" class="nav-btn" aria-label="下个月">›</button>
        </div>
        <table class="calendar">
          <thead><tr><th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th>日</th></tr></thead>
          <tbody id="cal-body"></tbody>
        </table>
        <div class="cal-detail" id="cal-detail" aria-live="polite"></div>
        <div class="legend">
          <span><i class="dot d-ok"></i>已签到</span>
          <span><i class="dot d-fail"></i>失败/异常</span>
          <span><i class="dot d-pending"></i>未签</span>
          <span><i class="dot d-none"></i>无记录</span>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
