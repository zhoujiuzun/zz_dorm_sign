<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签到管理后台</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="admin">
  <header class="topbar">
    <h1>签到管理后台</h1>
    <div class="topbar-right">
      <div class="today" id="today">--</div>
      <button type="button" id="signing-toggle-btn" class="btn-link" hidden>停止签到</button>
      <button type="button" id="logout-btn" class="btn-link" hidden>退出</button>
    </div>
  </header>

  <div class="login-mask" id="login-mask" hidden>
    <form class="login-box" id="login-form" novalidate>
      <h2>管理员登录</h2>
      <input type="text" id="login-user" placeholder="管理员账号" autocomplete="username" aria-label="管理员账号">
      <input type="password" id="login-pass" placeholder="密码" autocomplete="current-password" aria-label="密码">
      <div class="login-err" id="login-err" role="alert"></div>
      <button type="submit" class="btn-primary" id="login-btn">登录</button>
      <div class="dialog-foot"><a class="btn-link" href="/">返回签到看板</a></div>
    </form>
  </div>

  <div class="signing-notice" id="signing-notice" hidden>
    当前为假期暂停状态，系统不会自动提交签到。
  </div>

  <main id="main-content" hidden>
    <section class="overview" id="overview">
      <div class="stat stat-total"><span class="num" id="ov-total">-</span><span class="lbl">总人数</span></div>
      <div class="stat stat-ok"><span class="num" id="ov-ok">-</span><span class="lbl">今日已签</span></div>
      <div class="stat stat-fail"><span class="num" id="ov-fail">-</span><span class="lbl">今日异常</span></div>
      <div class="stat stat-pending"><span class="num" id="ov-pending">-</span><span class="lbl">今日未签</span></div>
    </section>

    <div class="layout admin-layout">
      <section class="left">
        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-view="members" role="tab">成员 <span id="cnt-members"></span></button>
          <button type="button" class="tab" data-view="inactive" role="tab">非活跃 <span id="cnt-inactive"></span></button>
        </div>
        <input type="search" id="search" class="search" placeholder="搜索姓名或学号…" autocomplete="off" aria-label="搜索">
        <div class="list-tools" id="ids-tools" hidden>
          <span id="ids-missing"></span>
          <button type="button" class="btn-link" id="backfill-btn">补全学号</button>
        </div>
        <div class="members" id="list" role="list"></div>
      </section>

      <section class="detail right" id="detail">
        <div class="detail-empty" id="detail-empty">在左侧选择一位成员，查看签到日历并管理签到设置</div>
        <div id="detail-body" hidden>
          <div class="uc-head">
            <div>
              <div class="uc-name" id="uc-name">--</div>
              <div class="uc-sub" id="uc-sub"></div>
            </div>
            <div class="uc-stats">
              <span class="chip chip-ok" id="uc-okdays">已签 -- 天</span>
              <span class="chip chip-fail" id="uc-faildays">异常 -- 天</span>
            </div>
          </div>
          <div class="blacklist-alert" id="uc-alert" hidden></div>

          <div class="detail-grid">
            <div class="detail-side">
              <section class="panel" id="settings-panel" aria-labelledby="settings-title">
                <h2 class="panel-title" id="settings-title">签到设置</h2>
                <div id="settings"></div>
              </section>
              <section class="panel" aria-labelledby="manage-title">
                <h2 class="panel-title" id="manage-title">成员管理</h2>
                <div class="action-row" id="manage"></div>
              </section>
            </div>
            <div class="detail-cal">
              <div class="cal-nav">
                <button type="button" id="prev-month" class="navbtn" aria-label="上个月">‹</button>
                <div class="cal-title" id="cal-title">----年--月</div>
                <button type="button" id="next-month" class="navbtn" aria-label="下个月">›</button>
              </div>
              <table class="calendar">
                <thead><tr>
                  <th>一</th><th>二</th><th>三</th><th>四</th><th>五</th><th>六</th><th class="sun">日</th>
                </tr></thead>
                <tbody id="cal-body"></tbody>
              </table>
              <div class="legend">
                <span><i class="dot d-ok"></i>已签到</span>
                <span><i class="dot d-fail"></i>失败/异常</span>
                <span><i class="dot d-pending"></i>未签</span>
                <span><i class="dot d-none"></i>无记录</span>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
